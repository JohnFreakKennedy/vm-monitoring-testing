apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "myApp.fullname" . }}-test-connection"
  labels:
    {{- include "myApp.labels" . | nindent 4 }}
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['http://{{ include "myApp.fullname" . }}:{{ .Values.myApp.service.port }}']
  restartPolicy: Never
